spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Arcane


  datasource :
    url: ${SPRING_DATASOURCE_URL}
    username : ${SPRING_DATASOURCE_USERNAME}
    password : ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa :
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            client-name: Google
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: Naver
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port : 8080

jwt:
  secret: ${JWT_SECRET}
  expiration : ${JWT_EXPIRATION}
  password : again

riot:
  # 이게 진짜임
  api-key: ${RIOT_API_KEY}

  patch-version : ${RIOT_PATCH_VERSION}
  season2024-1 : 1704844800
  season2024-2 : 1715731200
  season2025-1 : 1736434800
  season2025-2 : 1746019200
  season2025-3 : 1756281600

modeling:
  python-url: ${MODELING_PYTHON_URL}

app:
  oauth2:
    redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI}
